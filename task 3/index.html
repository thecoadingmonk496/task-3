<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Expense Tracker</h1>
            <p class="subtitle">Monitor your financial health</p>
        </header>

        <section class="summary-cards">
            <div class="card balance-card">
                <h3>Current Balance</h3>
                <h2 id="balance-amount">$0.00</h2>
            </div>
            <div class="card income-card">
                <div class="card-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7-7 7 7"/></svg>
                </div>
                <div class="card-info">
                    <h3>Total Income</h3>
                    <h2 id="income-amount">$0.00</h2>
                </div>
            </div>
            <div class="card expense-card">
                <div class="card-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7 7 7-7"/></svg>
                </div>
                <div class="card-info">
                    <h3>Total Expenses</h3>
                    <h2 id="expense-amount">$0.00</h2>
                </div>
            </div>
        </section>

        <div class="main-content">
            <section class="transaction-form-section">
                <h2>Add New Transaction</h2>
                <form id="transaction-form">
                    <input type="hidden" id="edit-id" value="">
                    
                    <div class="form-group">
                        <label>Type</label>
                        <div class="type-toggle">
                            <input type="radio" id="type-expense" name="type" value="expense" checked>
                            <label for="type-expense" class="toggle-btn expense-btn">Expense</label>
                            
                            <input type="radio" id="type-income" name="type" value="income">
                            <label for="type-income" class="toggle-btn income-btn">Income</label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="amount">Amount</label>
                        <div class="input-wrapper">
                            <span class="currency-symbol">$</span>
                            <input type="number" id="amount" placeholder="0.00" step="0.01" min="0.01" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="category">Category</label>
                        <select id="category" required>
                            <!-- Dynamically populated based on type -->
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="date">Date</label>
                        <input type="date" id="date" required>
                    </div>

                    <div class="form-group">
                        <label for="note">Note (Optional)</label>
                        <input type="text" id="note" placeholder="What was this for?">
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary" id="submit-btn">Add Transaction</button>
                        <button type="button" class="btn btn-secondary hidden" id="cancel-btn">Cancel Edit</button>
                    </div>
                </form>
            </section>

            <section class="transactions-section">
                <div class="transactions-header">
                    <h2>Recent Transactions</h2>
                    <div class="filter-group">
                        <select id="filter-category">
                            <option value="all">All Categories</option>
                            <optgroup label="Income" id="filter-income-group"></optgroup>
                            <optgroup label="Expenses" id="filter-expense-group"></optgroup>
                        </select>
                    </div>
                </div>

                <div class="transaction-list" id="transaction-list">
                    <!-- Transactions will be injected here -->
                    <div class="empty-state">
                        <p>No transactions found. Add one to get started!</p>
                    </div>
                </div>
            </section>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
